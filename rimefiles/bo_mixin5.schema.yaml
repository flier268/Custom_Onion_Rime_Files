################################### 選單 ######################################
menu:
  __include: element_bopomo:/menu
################################### 拼寫 ######################################
speller:
  alphabet: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 3467"
  initials: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-"
  finals: " 6347"
  delimiter: "\\"
  use_space: true
  algebra:
##### 非正確注音（補空碼或慣用發音）轉寫 #####
    - xform/[)(]//
##### 拼音轉注音 #####
    - xform/iu/iU/ #iou
    - xform/ui/uI/ #uei
    - xform/ong/ung/
    - xform/yi?/i/
    - xform/wu?/u/
    - xform/iu/v/
    - xform/([jqx])u/$1v/
    - xform/([iuv])n/$1en/
    - xform/zhi?/Z/
    - xform/chi?/C/
    - xform/shi?/S/
    - xform/([zcsr])i/$1/
    - xform/ai/A/
    - xform/ei/I/
    - xform/ao/O/
    - xform/ou/U/
    - xform/ang/K/
    - xform/eng/G/
    - xform/an/M/
    - xform/en/N/
    - xform/er/R/
    - xform/eh/E/
    - xform/([iv])e/$1E/
##### 注音字母簡化 #####
    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR]).+$/$1/
    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuv])([iuvaoeEAIOUMNKG])\d$/$1$2/ #[R]
    - abbrev/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])\d$/$1$2$3/ #[R]
##    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuv]).+$/$1/ #derive
##    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR]+)\d$/$1/ #derive
#    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuv]).+(\d)$/$1$2/ #使得ㄎˇㄈˇ（可否）可以打的出來 #新增iuv，使得ㄧˊㄉˊ（贏得）可以打出
#    - abbrev/^([bpmfdtnlgkhjqxZCSrzcs]).+(\d)$/$1$2/ #同上，但少了ㄧㄨㄩ
#    - abbrev/^([bpmfdtnlgkhjqx]).+(\d)$/$1$2/ #同上，但再少了ㄓㄔㄕㄖㄗㄘㄙ
    - derive/^([bpmfdtnlgkhjqx]).+(\d)$/$1$2/
##### 內嵌注音文 #####
    - xform|^＊([12345])$|r$1| #聲調，「ㄖ」「聲調」打出聲調不被省略
    - abbrev|^＊([bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR])$|$1|
    - xform|^＊([bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR])$|$1 | #下兩則 xform 合併處理 #\x31=數字1
    # - xform|^＊([bpmfdtnlgkhjqx])$|$1 | #\x31=數字1
    # - erase|^＊([bpmfdtnlgkhjqx])$|| #消除不含聲調注音（不消除也不影響） #如果上一則為 abbrev 才需要，xform 不需要
    # - xform|^＊([ZCSrzcsiuvaoeEAIOUMNKGR])$|$1 | #\x31=數字1
    - xform|^＊＊|| #開頭「＊＊」使注音文不被前面縮略，該正則回復
##### 注音聲韻母亂序 #####
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])/$2$1/
    - derive/^([iuv])([aoeEAIOUMNKG])/$2$1/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([aoeEAIOUMNKG])/$2$1/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$3$2$1/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$3$1$2/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$2$3$1/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$1$3$2/ #[R]
    - 'xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR12345|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347|'
################################### 主注音引擎 ######################################
translator:
  dictionary: bo_mixin5.extended
  prism: bo_mixin5
  # enable_charset_filter: false
  enable_completion: false #新版有長詞補全，用此關閉
  enable_user_dict: true
  # initial_quality: 1
  preedit_format:
    __include: element_bopomo:/preedit_b_1_2_4
################################### 調出 Easy 英語 ######################################
easy_en:
  tag: easy_en
  dictionary: easy_en_lower #easy_en_super
  # enable_encoder: false
  # encode_commit_history: false
  enable_sentence: false
  enable_completion: true
  # sentence_over_completion: false
  enable_user_dict: false
  # strict_spelling: false
  # spelling_hints: 2
  # initial_quality: 1000
  prefix: "3"
  # suffix: " "
  tips: "《Easy》▶"
  closing_tips: "◀《Easy》"
  extra_tags:
    - easy_en_upper
    # - easy_en_script
  preedit_format:
    - xform/^/《Easy》/
    # - xform/》;/》; /
    # - xform|》[/]|》/ |
    # - xform|》'|》' |
    - 'xform/\\/ /'
  comment_format:
    - xform/.+//  #刪除尚未輸入完整碼之提示 ~abc
  #   # - xform|[~a-z;/.'-]+||
  #   - xform/^.+⌗// #easy_en_super用
  #   - xform|^[ a-z;/.'-]+|| #easy_en_super用
  #   - xform/@@/\n          /
  #   - xform/@/ /

# easy_en_script:
#   __include: /easy_en
#   tag: easy_en_script
#   # enable_encoder: true
#   enable_completion: false
#   enable_sentence: false
#   enable_user_dict: false
#   # spelling_hints: 1
#   # initial_quality: 0
#   extra_tags: []
#   # comment_format: []

easy_en_upper:
  tag: easy_en_upper
  dictionary: easy_en_upper
  # enable_encoder: false
  # encode_commit_history: false
  enable_sentence: false
  enable_completion: false
  # sentence_over_completion: false
  enable_user_dict: false
  preedit_format:
    - xform/^/《Easy》/
    - xform/\\/ /

e_reverse_lookup:
  tags: [ easy_en ]
  overwrite_comment: true
  dictionary: easy_en_lcomment #easy_en_super
  comment_format:
    # - xform/^.+⌗// #easy_en_super用
    # - xform|^[ a-z;/.'-]+|| #easy_en_super用
    - xform/@@/\n          /
    - xform/@/ /
################################### 全形 ######################################
fs2:
  tag: fs2
  dictionary: fullshape.extended
  prism: fullshape
  # enable_charset_filter: false
  enable_completion: false
  enable_user_dict: true
  prefix: "]["
  suffix: "'"
  tips: "《全》▶"
  closing_tips: "◀《全》"
  disable_user_dict_for_patterns:
    - ^[-a-z,./]{1}[;/]?$
  preedit_format:
    - xform/^/《全》/
    - 'xform/\\/ /'
################################『ㄅㄆㄇ注音文』##################################
all_bpm:
  tag: all_bpm
  dictionary: allbpm
  # enable_charset_filter: false
  enable_completion: false
  enable_user_dict: false
  prefix: "';"
  suffix: "'"
  tips: "《注音文》▶"
  closing_tips: "◀《注音文》"
  preedit_format:
    - xform/';'?/A/
    - xform/^/《注音文》/
    - xform/^《注音文》(.+)A$/$1《注音文》/
    - xform/A//
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-6347 |ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˊˇˋ˙ˉ|"
    - 'xform/\\//'
################################### 短語 ######################################
# custom_phrase:
#   dictionary: ""
#   user_dict: bo_mixin_phrase
#   db_class: stabledb
#   enable_completion: false
#   enable_sentence: false
