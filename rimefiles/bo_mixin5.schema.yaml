############################# 反查注音 ###################################
reverse2_lookup:
  tag: reverse2_lookup
  dictionary: cangjie5
  # enable_charset_filter: false
  enable_completion: false
  enable_user_dict: true
  prefix: "="
  suffix: "'"
  tips: "《查》▶"
  closing_tips: "◀《查》"
  preedit_format:
#    - "xlit|abcdefghijklmnopqrstuvwxyz|ABCDEFGHIJKLMNOPQRSTUVWXYZ|"
    - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|"
    - xform/^/《查》/
    - 'xform/\\/ /'

bpm_reverse_lookup:
  tags: [ reverse2_lookup ]
  overwrite_comment: true
  dictionary: bo_mixin5.extended
  comment_format:
    - xform/@[a-z]+ ?//
    - xform/!!!?[a-z]+ ?//
    - xform/iu/iU/ #iou
    - xform/ui/uI/ #uei
    - xform/ong/ung/
    - xform/yi?/i/
    - xform/wu?/u/
    - xform/iu/v/
    - xform/([jqx])u/$1v/
    - xform/([iuv])n/$1en/
    - xform/zhi?/Z/
    - xform/chi?/C/
    - xform/shi?/S/
    - xform/([zcsr])i/$1/
    - xform/ai/A/
    - xform/ei/I/
    - xform/ao/O/
    - xform/ou/U/
    - xform/ang/K/
    - xform/eng/G/
    - xform/an/M/
    - xform/en/N/
    - xform/er/R/
    - xform/eh/E/
    - xform/([iv])e/$1E/
    - xform/1//
    - 'xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR2345|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˊˇˋ˙|'
################################### 系列符號 ######################################
emoji_series:
  tag: emoji_series
  dictionary: symbols_bpmf
  # enable_charset_filter: false
  # enable_encoder: false
  # encode_commit_history: false
  enable_sentence: false
  enable_completion: false
  # sentence_over_completion: false
  enable_user_dict: true
  prefix: "`"
  suffix: "'"
  tips: "《emoji集》▶"
  closing_tips: "◀《emoji集》"
  preedit_format:
    __include: element_bopomo:/emoji_series
################################### 符號處理 ######################################
punctuator:
  import_preset: punct_bopomo
################################ 按鍵處理 ###################################
key_binder:
  import_preset: default
  bindings:
    ### 以下舊的寫法（需去除「element_bopomo:/key_binder」中的「__append:」） ###
    # __include: element_bopomo:/key_binder
    # __patch: element_bopomo:/key_binder_plus
    # __append:
    ### 以下新的寫法 ###
    __patch:
      - element_bopomo:/key_binder
      - element_bopomo:/key_binder_plus

editor:
  bindings:
    __include: element_bopomo:/editor
########################## 正則調出各種功能 ##############################
recognizer:
  patterns:
    __include: element_bopomo:/r_patterns_mixin_1_2_4
    # __include: element_bopomo:/patterns_mixin_1_2_4

recognizer2:
  patterns:
    __include: element_bopomo:/r2_patterns_mixin_1_2_4

style:
  inline_preedit: false

